spring.application.name=menu-service
server.port=8082
# Database Connection (MySQL Docker instance)
spring.datasource.url=jdbc:mysql://localhost:3306/tableease_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

# Eureka Discovery Server Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Force Eureka to use IP address instead of hostname
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1