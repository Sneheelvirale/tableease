<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableEase - My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a href="index.html" class="navbar-brand fw-bold text-primary">TableEase</a>
            <div class="navbar-nav">
                <a href="index.html" class="nav-link">Menu</a>
                <a href="tables.html" class="nav-link">Tables</a>
                <a href="booking.html" class="nav-link">Book a Table</a>
                <a href="my-booking.html" class="nav-link active">My Booking</a>
                <a href="login.html" class="nav-link" id="navbar-auth-link">Login</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h2 class="mb-4">My Bookings</h2>
        <div id="alert-container"></div>
        <div id="loading" class="text-center my-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover shadow-sm d-none" id="bookings-table">
                <thead class="table-dark">
                    <tr>
                        <th>Booking ID</th>
                        <th>Name</th>
                        <th>Table No</th>
                        <th>Guests</th>
                        <th>Date &Time</th>
                    </tr>
                </thead>
                <tbody id="booking-list">

                </tbody>
            </table>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/my-bookings.js"></script>
</body>
</html>
