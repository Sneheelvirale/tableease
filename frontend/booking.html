<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableEase - Book a Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a href="index.html" class="navbar-brand fw-bold text-primary">TableEase</a>
            <div class="navbar-nav">
                <a href="index.html" class="nav-link">Menu</a>
                <a href="tables.html" class="nav-link">Tables</a>
                <a href="booking.html" class="nav-link active">Book a Ticket</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4">Book a Table</h2>
                        
                        <div id="alert-container"></div>

                        <form id="booking-form">
                            <div class="mb-3">
                                <label for="customerName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="customerName" required placeholder="Enter your name">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="bookingDate" class="form-label">Date</label>
                                    <input type="date" class="form-control" id="bookingDate" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="bookingTime" class="form-label">Time</label>
                                    <input type="time" class="form-control" id="bookingTime" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tableId" class="form-label">Table Number / ID</label>
                                    <input type="number" class="form-control" id="tableId" required placeholder="e.g. 1">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="guests" class="form-label">Number of Guests</label>
                                    <input type="number" class="form-control" id="guests" min="1" max="10" value="2" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mt-2" id="submit-btn">
                                Confirm Booking
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/booking.js"></script>
</body>
</html>
