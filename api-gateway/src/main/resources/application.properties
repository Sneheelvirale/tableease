server.port=8085
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Route 0: Menu Service (Secured with Filter)
spring.cloud.gateway.routes[0].id=menu-service
spring.cloud.gateway.routes[0].uri=lb://menu-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/menu/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# Route 1: Auth Service (Public Access)
spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**

# Route 2: Order Service (Secured with AuthenticationFilter)
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# Force IP registration instead of hostname
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Enable Health Check for Eureka
eureka.client.healthcheck.enabled=false